<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loanville Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="loader-icon">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <circle cx="40" cy="40" r="35" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="180 40" class="loader-ring"/>
          <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#B68F40"/>
              <stop offset="50%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#B68F40"/>
            </linearGradient>
          </defs>
          <text x="40" y="46" text-anchor="middle" fill="#FFD700" font-family="Cinzel" font-size="16" font-weight="700">LV</text>
        </svg>
      </div>
      <div class="loader-text">LOANVILLE ARENA</div>
      <div class="loader-sub">Loading simulation data...</div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">

    <!-- Top Nav Bar -->
    <nav class="top-nav">
      <div class="nav-brand" onclick="router.navigate('dashboard')">
        <svg viewBox="0 0 32 32" width="28" height="28" class="nav-logo">
          <circle cx="16" cy="16" r="14" fill="none" stroke="#FFD700" stroke-width="1.5"/>
          <text x="16" y="20" text-anchor="middle" fill="#FFD700" font-family="Cinzel" font-size="10" font-weight="700">LV</text>
        </svg>
        <span class="nav-title">Loanville</span>
        <span class="nav-badge">ARENA</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" data-view="dashboard" onclick="router.navigate('dashboard')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5l-7 5.25V14h5v-4h4v4h5V6.75L8 1.5z"/></svg>
          Dashboard
        </a>
        <a class="nav-link" data-view="leaderboard" onclick="router.navigate('leaderboard')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 12h3v3H2zm4.5-5h3v8h-3zM11 3h3v12h-3z"/></svg>
          Leaderboard
        </a>
        <a class="nav-link" data-view="matches" onclick="router.navigate('matches')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2h14v2H1zm0 4h14v2H1zm0 4h10v2H1zm0 4h6v2H1z"/></svg>
          Matches
        </a>
        <a class="nav-link" data-view="compare" onclick="router.navigate('compare')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0v16M4 3a4 4 0 000 10M12 3a4 4 0 010 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          Compare
        </a>
      </div>
      <div class="nav-meta">
        <span class="meta-pill">
          <span class="meta-dot"></span>
          <span id="meta-matches">0</span> matches
        </span>
        <span class="meta-pill">
          <span id="meta-models">0</span> models
        </span>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Views are rendered here dynamically -->
    </main>

  </div>

  <script src="sample-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
